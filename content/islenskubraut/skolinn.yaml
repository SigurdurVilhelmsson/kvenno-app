examples:
  A1: Þetta er bók. Ég er í skólastofunni. Við lesum í tímanum.
  A2: Í stærðfræði lærum við að reikna. Ég þarf reiknivél til að reikna. Kennarinn biður okkur að svara.
  B1: Í dag lærðum við um breytingar á loftslagi. Þær skipta máli vegna þess að þær hafa áhrif á alla. Hvað finnst þér um það?
teacherNotes:
  A1: Nemandi bendir á hluti og staði í skólanum og nefnir þá. Æfið fyrirmælin í raun, til dæmis með því að biðja nemandann að lesa eða skrifa.
  A2: Nemandi segir hvað gert er í hverju fagi og skilur algeng fyrirmæli. Hvetjið nemandann til að biðja um hjálp með setningunni „Ég skil ekki …“.
  B1: Rammarnir fylgja fjórum leiðum til að nota tungumálið í námi, að segja frá, útskýra, rökstyðja og ræða. Námsorðin koma úr LÍNO-2 og eru notuð í öllum fögum.
