id: stadir
name: Staðir og byggingar
icon: 🏠
description: Orðaforði um staði — tegundir bygginga og hvað maður gerir þar
color: "#C1121F"
subCategories:
  - id: s1
    name: Tegund
    options:
      - hús
      - íbúð
      - skóli
      - sjúkrahús
      - búð/verslun
      - veitingastaður
      - safn
      - kirkja
      - sundlaug
      - leikvöllur
  - id: s2
    name: Staðsetning
    options:
      - í bænum/borginni
      - í úthverfi
      - á landi/sveitinni
      - við sjóinn
      - í fjöllunum
  - id: s3
    name: Stærð
    options:
      - lítill/lítil/lítið
      - meðalstór/meðalstórt
      - stór/stórt
  - id: s4
    name: Hvað gerir maður þar
    options:
      - borðar
      - verslar
      - syndir
      - lærir
      - vinnur
      - sefur
      - leikur sér
sentenceFrames:
  - id: f1
    level: A1
    frames:
      - Þetta er ___.
      - Maður ___ þar.
      - Það er ___.
      - Maður notar það ___.
  - id: f2
    level: A2
    frames:
      - Þetta er ___ sem er ___.
      - Maður fer þangað ___.
      - Það er gert ___.
      - Maður finnur það ___.
      - Maður notar það ___.
  - id: f3
    level: B1
    frames:
      - Þetta er ___ sem er staðsett ___.
      - Fólk fer þangað ___ og ___.
      - Mér finnst þetta ___ vegna þess að ___.
      - Það er gert ___ sem er ___.
      - ___ nota það oftast ___.
examples:
  A1: Þetta er skóli. Maður lærir þar.
  A2: Þetta er sundlaug sem er í bænum. Maður fer þangað til að synda.
  B1: Þetta er safn sem er staðsett í borginni. Fólk fer þangað til að læra og skoða list.
teacherNotes:
  A1: "Nemandi bendir á orð af spjaldinu og myndar einfaldar setningar. Hjálpið nemandanum að velja rétt orð og segja heila setningu. Fornafnið fer eftir kyni orðsins: bíll → hann, úlpa → hún, skip → það."
  A2: Nemandi tengir saman tvær eða þrjár setningar. Hvetjið nemandann til að nota mismunandi orð úr undirflokkunum.
  B1: Nemandi notar setningaramma sem grunn en bætir við eigin hugmyndum. Hvetjið til samanburðar og rökstuðnings.
