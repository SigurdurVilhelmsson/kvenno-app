sentenceFrames:
  - id: f1
    level: A1
    frames:
      - Þetta er ___.
      - Það er ___.
      - Maður notar það ___.
  - id: f2
    level: A2
    frames:
      - Þetta er ___ sem er ___.
      - Maður klæðist því ___.
      - Það finnst ___ við snertingu.
      - Það er gert ___.
      - Maður finnur það ___.
      - Maður notar það ___.
  - id: f3
    level: B1
    frames:
      - Þetta er ___ sem er ___. Maður notar það ___.
      - Það er ___ og hentar vel ___.
      - Það er ___ að snerta vegna þess að ___.
      - Það er gert ___ sem er ___.
      - ___ nota það oftast ___.
examples:
  A1: Þetta er úlpa. Hún er blá.
  A2: Þetta er peysa sem er rauð. Maður klæðist henni á veturna.
  B1: Þetta er jakki sem er úr leðri. Maður notar hann á veturna. Hann er svartur og hentar vel í kulda.
teacherNotes:
  A1: "Nemandi bendir á orð af spjaldinu og myndar einfaldar setningar. Hjálpið nemandanum að velja rétt orð og segja heila setningu. Fornafnið fer eftir kyni orðsins: bíll → hann, úlpa → hún, skip → það."
  A2: Nemandi tengir saman tvær eða þrjár setningar. Hvetjið nemandann til að nota mismunandi orð úr undirflokkunum.
  B1: Nemandi notar setningaramma sem grunn en bætir við eigin hugmyndum. Hvetjið til samanburðar og rökstuðnings.
