# Hvað er þetta? — the guessing game for Manneskja. See README.md beside this file.
# Drafted by Claude; a teacher sets `confirmed: true` once the descriptions are right.
# The people are jobs, not family members, so the game asks nothing about a student's own
# family or journey. Each card describes one made-up person who does that job.
confirmed: false
items:
  - name: nemandi
    from: A1
    answers:
      Flokkar: [barn, unglingur]
      Útlit: [ung/ungur, með stutt hár]
      notagildi: [lærir, leikur sér]
      hvar: [í skólanum]
      hvenaer: [á morgnana, á virkum dögum]
  - name: kennari
    from: A1
    answers:
      Flokkar: [fullorðin/fullorðinn]
      Útlit: [há/hár, með gleraugu]
      notagildi: [vinnur, kennir]
      hvar: [í skólanum, í vinnunni]
      hvenaer: [á morgnana, á virkum dögum]
  - name: læknir
    from: A1
    answers:
      Flokkar: [fullorðin/fullorðinn]
      Útlit: [gömul/gamall, með gleraugu, sköllótt/sköllóttur]
      notagildi: [vinnur, læknar]
      hvar: [í vinnunni, á sjúkrahúsi]
      hvenaer: [alltaf]
  - name: kokkur
    from: A1
    answers:
      Flokkar: [fullorðin/fullorðinn]
      Útlit: [lág/lágur, með skegg]
      notagildi: [vinnur, skapar]
      hvar: [í vinnunni]
      hvenaer: [á kvöldin, um helgar]
  - name: íþróttamaður
    from: A1
    answers:
      Flokkar: [fullorðin/fullorðinn, fræg/frægur]
      Útlit: [há/hár, ung/ungur]
      notagildi: [vinnur, leikur sér]
      hvar: [í sjónvarpi]
      hvenaer: [á daginn, um helgar]
  - name: söngvari
    from: A2
