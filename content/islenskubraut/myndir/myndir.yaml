# Pictograms for the A1 answer chips (REVIEW-QUEUE D3, C10). Every chip a student sees on an A1
# card has an entry here. See README.md beside this file for the workflow and ARASAAC's licence.
#
#   search:   the English word ARASAAC is searched for. Drafted by Claude; change it if the
#             pictures it finds are wrong, then delete `id` and run `pnpm islenskubraut:myndir --fetch`.
#   id:       the ARASAAC pictogram chosen. `--fetch` fills it with the best match; replace it
#             with another number from the review sheet if a better one is there.
#   approved: true once a person has looked at the picture beside the word and agreed. Only an
#             approved picture is shown to students.
#
# `words` holds one entry per chip, whatever card it is on. `categories` overrides it for a
# card where the same chip means something else: on Staðir, `hátt` is a tall building, not a
# loud sound.

