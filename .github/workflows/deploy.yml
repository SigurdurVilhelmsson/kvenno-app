name: Deploy

on:
  # Deploy after CI passes on main
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Prevent parallel deploys
concurrency:
  group: deploy-production
  cancel-in-progress: false

# Required GitHub secrets:
#   SSH_PRIVATE_KEY  — SSH private key for the deploy user
#   DEPLOY_HOST      — Server hostname (e.g., kvenno.app)
#   DEPLOY_USER      — SSH username (e.g., siggi)
#   DEPLOY_PATH      — Web root on server (e.g., /var/www/kvenno.app)

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy frontend
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/

      # Build a standalone, self-contained bundle of the server package
      # (compiled dist/ + resolved prod node_modules) so the production host
      # never needs workspace context or a pnpm install. Mirrors scripts/deploy.sh.
      - name: Bundle backend
        run: pnpm --filter kvenno-server deploy --prod /tmp/kvenno-server-bundle

      - name: Verify backend bundle is complete
        run: |
          if [ ! -f /tmp/kvenno-server-bundle/dist/index.js ]; then
            echo "::error::Backend bundle is missing dist/index.js — the systemd unit runs 'node dist/index.js' and would crash-loop. Aborting before touching production."
            exit 1
          fi

      - name: Deploy backend
        run: |
          rsync -avz --delete \
            --exclude='.env' \
            -e "ssh -i ~/.ssh/deploy_key" \
            /tmp/kvenno-server-bundle/ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/kvenno-server/

      - name: Restart backend
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "\
            sudo systemctl restart kvenno-backend"

      - name: Set permissions
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "\
            sudo chown -R www-data:www-data ${{ secrets.DEPLOY_PATH }} && \
            sudo chmod -R 755 ${{ secrets.DEPLOY_PATH }}"

      # Checked on the host against the backend port directly, not via
      # https://$DEPLOY_HOST/health: nginx only proxies /api/, so a public
      # /health request falls through to `try_files $uri /index.html` and
      # returns the SPA with HTTP 200 even when the backend is dead.
      # The Origin header is required — in production the CORS policy rejects
      # origin-less requests with HTTP 500.
      - name: Health check
        run: |
          echo "Waiting for backend to come up..."
          STATUS="000"
          for _ in $(seq 1 10); do
            STATUS=$(ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
              "curl -s -o /dev/null -w '%{http_code}' -H 'Origin: https://${{ secrets.DEPLOY_HOST }}' http://127.0.0.1:8000/health" 2>/dev/null || echo "000")
            [ "$STATUS" = "200" ] && break
            sleep 3
          done
          if [ "$STATUS" = "200" ]; then
            echo "Backend health check passed (HTTP 200)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Backend health check failed (HTTP $STATUS) after 10 attempts"
            echo "Backend health check FAILED (HTTP $STATUS)" >> "$GITHUB_STEP_SUMMARY"
            ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
              "sudo journalctl -u kvenno-backend -n 30 --no-pager" || true
            exit 1
          fi

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
